name: RVNKQuests
api: "1.17"
version: 1.0.0
description: A quest system for Minecraft
authors: [YourName]
main: org.fourz.RVNKQuests.RVNKQuests
api-version: 1.17

commands:
  quest:
    description: Main command for the RVNKQuests plugin
    usage: |
      §6=== RVNKQuests Commands ===
      §e/quest item <item_name>§7 - Get a quest item
      §e/quest trigger <quest_id> [here|around]§7 - Trigger a quest
      §e/quest state <quest_id> <state>§7 - Change quest state 
      §e/quest reload§7 - Reload plugin configuration
      §7Use TAB for autocomplete
    aliases: [quests, q]

permissions:
  rvnkquests.command.item:
    description: Allows players to get quest items
    default: op
  rvnkquests.command.state:
    description: Allows players to change quest states
    default: op
  rvnkquests.command.trigger:
    description: Allows players to trigger quests at specific locations
    default: op
  rvnkquests.command.reload:
    description: Allows players to reload the plugin configuration
    default: op