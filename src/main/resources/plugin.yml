name: RVNKQuests
api: "1.17"
version: '${project.version}'
description: A quest system for Minecraft
authors: [Fourz]
main: org.fourz.RVNKQuests.RVNKQuests
api-version: '26.1'
depend: [RVNKCore]
softdepend: [RVNKLore, RVNKWorlds]

commands:
  quest:
    description: Main command for the RVNKQuests plugin
    usage: |
      §6=== RVNKQuests Commands ===
      §e/quest list§7 - List available quests
      §e/quest start <quest_id> [player]§7 - Start a quest
      §e/quest progress <quest_id> [player]§7 - Check quest progress
      §e/quest abandon <quest_id> [player]§7 - Abandon a quest
      §e/quest journal [player]§7 - View quest journal
      §e/quest menu [filter] [player]§7 - Open quest GUI menu
      §e/quest leaderboard [type]§7 - View leaderboards
      §e/quest prefs§7 - Notification preferences
      §7Use TAB for autocomplete
    aliases: [quests, q]

permissions:
  # ── Player commands ───────────────────────────────────────────────────────
  rvnkquests.quest:
    description: Base permission for /quest command
    default: true
  rvnkquests.list:
    description: List available quests (/quest list)
    default: true
  rvnkquests.menu:
    description: Open quest GUI menu (/quest menu)
    default: true
  rvnkquests.start:
    description: Start a quest (/quest start)
    default: true
  rvnkquests.abandon:
    description: Abandon an active quest (/quest abandon)
    default: true
  rvnkquests.progress:
    description: Check quest progress (/quest progress)
    default: true
  rvnkquests.journal:
    description: View quest journal (/quest journal)
    default: true
  rvnkquests.party:
    description: Manage a quest party (/quest party) — shared beat advancement (#1982)
    default: true
  rvnkquests.leaderboard:
    description: View quest leaderboards (/quest leaderboard)
    default: true
  rvnkquests.chain:
    description: View and interact with quest chains (/quest chain)
    default: true
  rvnkquests.prefs:
    description: Manage quest notification preferences (/quest prefs)
    default: true
  rvnkquests.player:
    description: General player quest access (wildcard alternative for player group assignment)
    default: true

  # ── Staff commands ────────────────────────────────────────────────────────
  rvnkquests.item:
    description: Get quest items (/quest item)
    default: op
  rvnkquests.state:
    description: Change quest states (/quest state)
    default: op
  rvnkquests.trigger:
    description: Trigger quests at specific locations (/quest trigger)
    default: op
  rvnkquests.menu.other:
    description: Open quest menu for other players (/quest menu <filter> <player>)
    default: op
  rvnkquests.journal.other:
    description: View quest journal for other players (/quest journal <player>)
    default: op
  rvnkquests.journal.remove:
    description: Remove journal entries (/quest journal remove)
    default: op
  rvnkquests.journal.staff:
    description: Assign/unassign journal entries for other players (/quest journal assign|unassign)
    default: op

  # ── Admin — lifecycle ─────────────────────────────────────────────────────
  rvnkquests.admin:
    description: Catch-all admin access — grants all quest management commands
    default: op
  rvnkquests.admin.complete:
    description: Force complete quests for players (/quest complete)
    default: op
  rvnkquests.admin.reset:
    description: Reset quest progress for players (/quest reset)
    default: op
  rvnkquests.admin.objective:
    description: Edit individual objective progress (/quest objective)
    default: op

  # ── Admin — system management ─────────────────────────────────────────────
  rvnkquests.admin.reload:
    description: Reload plugin configuration and quest data (/quest reload)
    default: op
  rvnkquests.admin.mobs:
    description: List and manage quest mobs (/quest mobs)
    default: op
  rvnkquests.admin.config:
    description: View and edit plugin configuration (/quest config)
    default: op
  rvnkquests.admin.validate:
    description: Validate quest definitions and system integrity (/quest validate)
    default: op

  # ── Admin — quest authoring ───────────────────────────────────────────────
  rvnkquests.admin.create:
    description: Create quest definitions (/quest create)
    default: op
  rvnkquests.admin.delete:
    description: Permanently delete quest definitions (/quest delete)
    default: op
  rvnkquests.admin.edit:
    description: Edit quest definitions, objectives, and rewards (/quest edit, /quest reward)
    default: op
  rvnkquests.admin.export:
    description: Export quest definitions to YAML (/quest export)
    default: op
  rvnkquests.admin.import:
    description: Import quest definitions from YAML (/quest import)
    default: op

  # ── Admin — debug ─────────────────────────────────────────────────────────
  rvnkquests.admin.debug:
    description: Set quest state, bypassing validation (/quest debug setstate)
    default: op
  rvnkquests.admin.seed:
    description: Seed and clean up test quest data (/quest debug seed)
    default: op
