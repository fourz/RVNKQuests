general:
  # Valid log levels: OFF, SEVERE, WARNING, INFO, DEBUG, FINE
  # DEBUG and FINE are equivalent and both enable debug logging
  # Default: WARNING (quiet mode - set INFO for verbose operational logs)
  logLevel: WARNING

quests:
  # Announce quest completions server-wide
  announce_completion: true

  # Default world for quest triggers and objectives
  # Used by seeded quest definitions — change before first startup or reseed
  default_world: event

  # Individual quest configuration
  piglin_far_from_home:
    enable: true
  ancient_guardian:
    enable: true
  first_city_prophecy:
    enable: true
  ashen_pilgrim:
    enable: true

# Database configuration for quest progress persistence
database:
  # Storage type: yaml | sqlite | mysql
  # yaml - Simple file-based storage (default for small servers)
  # sqlite - Local database file (recommended for most servers)
  # mysql - External MySQL server (for multi-server setups)
  type: mysql

  # Autosave interval in seconds (0 to disable)
  autosave_interval: 300

  # MySQL settings (only used when type: mysql)
  mysql:
    host: 64.20.41.122
    port: 3306
    database: fourzorg_rvnkcore_dev
    username: fourzorg_rvnkuser
    password: ''
    useSSL: true
    # Table prefix for shared database hosting (e.g., "quests_" creates "quests_quest_progress")
    tablePrefix: ""

  # SQLite settings (only used when type: sqlite)
  sqlite:
    # Database file path relative to plugin folder
    file: data/quests.db
    # Table prefix for shared database hosting (e.g., "quests_" creates "quests_quest_progress")
    tablePrefix: ""

  # Fallback settings - graceful degradation when database fails
  fallback:
    # Enable automatic fallback to YAML on database failures
    enabled: true
    # Number of consecutive failures before entering fallback mode
    consecutive_failures: 3
    # Minutes to wait before attempting database reconnection
    recovery_minutes: 5

# Legacy storage settings (kept for backwards compatibility)
storage:
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    username: root
    password: ''
    useSSL: false
    database:
    tablePrefix:
  sqlite:
    database: data.db

mob_detection:
  # Detect pre-existing mobs by name+type+world for quest triggers
  name_type_matching: true
  # Scan throttle in ms (entity scanning on move events)
  scan_interval_ms: 1000

messages:
  generic:
    error:
    - '[Error]'
    success:
    - '[Success]'
    info:
    - '[Info]'
    help:
    - '[Help]'
    no_held_item:
    - 'You must be holding an item!'
