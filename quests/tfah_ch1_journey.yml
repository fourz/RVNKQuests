quest_id: tfah_ch1_journey
name: The Quiet World
description: A lectern stands in the ruins of Alpha Centauri. Read the Hat's tale, then follow the road -- across the great bridge, through Ravenport, to the Archean Railway -- and ride the line north to Nocturne, city of the dead.
repeatable: false
cooldown_minutes: 0
metadata:
  required_worlds:
  - alphac
  start_trigger: The Quiet World
  chain: tfah_chapter1
  chapter: 1
  components:
    # RESOLVED 2026-08-10 (#1881). The lectern was never missing — the coordinate was wrong. Read
    # off the live Event world: the real block is alphac -316,118,447, a LECTERN holding the
    # written book "THE QUIET WORLD" (rvnklore lore_item_id 48, entry e27e0d5f-1cb9-47f2-8729-
    # b953703ab420) whose pages are the Chapter 1 route. That is 1.41 blocks from the old
    # -315,118,446 -- not the 2.24 the 08-02 handoff recorded, and -315,116,447 was never it.
    # The trigger fired anyway because STRUCTURE_INTERACT uses a 3.0 radius; only preflight, which
    # checks the exact block, reported the BLOCKER. Coordinate now matches the world.
    lectern_trigger:
      type: STRUCTURE_INTERACT
      block_type: LECTERN
      world: alphac
      x: -316
      y: 118
      z: 447
      required_state: NOT_STARTED
      advance_state: TRIGGER_FOUND
      advance_message: "&7You read, and it begins. &fWest, to the great bridge - the ground gives out before Ravenport."
    reach_bridge:
      objective_type: REACH
      world: alphac
      x: -456.0
      y: 69.0
      z: 365.0
      radius: 20.0
      required_state: TRIGGER_FOUND
      advance_state: QUEST_ACTIVE
      advance_message: "&7The bridge is behind you. &fRavenport stands north - someone counted every soul who left, and his tally is still there."
    reach_railway:
      objective_type: REACH
      world: alphac
      x: -783.0
      y: 65.0
      z: 286.0
      radius: 20.0
      required_state: QUEST_ACTIVE
      advance_state: OBJECTIVE_FOUND
      advance_message: "&7You have found the Archean Railway. &fRide north to Nocturne - the stations are kept, and little else here is."
    reach_nocturne:
      objective_type: REACH
      world: alphac
      x: 1443.0
      y: 82.0
      z: 1149.0
      radius: 30.0
      required_state: OBJECTIVE_FOUND
      advance_state: COMPLETED
  state_mapping:
    NOT_STARTED:
    - lectern_trigger
    TRIGGER_FOUND:
    - reach_bridge
    QUEST_ACTIVE:
    - reach_railway
    OBJECTIVE_FOUND:
    - reach_nocturne
rewards:
  journey_xp:
    type: EXPERIENCE
    value: points
    amount: 400
  journey_book:
    type: COMMAND
    value: 'lore item give "THE RECORD OF NOCTURNE" %player%'
    amount: 1
  journey_pick:
    type: COMMAND
    value: 'lore item give "Nickel''s Pick" %player%'
    amount: 1
  journey_say:
    type: COMMAND
    value: 'say [The Hat] Nocturne keeps the graves. The man who signed is under them.'
    amount: 1
